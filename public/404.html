<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EIGER</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
  <style>
    html, body { margin: 0; min-height: 100%; background: #0A0A0A; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { min-height: 100vh; display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center; padding: 2rem; gap: 1rem; }
    h1 { font-size: 2rem; margin: 0; }
    p { color: rgba(255,255,255,.6); margin: 0; }
    a { color: #fff; }
  </style>
  <script>
    // GitHub Pages serves this page for any path it has no file for, which
    // includes every app route loaded directly (/about, /giveaway?ref=abc).
    // Hand the path and query to the app at / using the spa-github-pages
    // encoding: /giveaway?ref=abc becomes /?/giveaway&ref=abc (a literal "&"
    // is written as "~and~"). src/lib/hashRedirect.js decodes it before the
    // router renders, restoring the exact original path and query. Paths that
    // look like files (a dot in the last segment) stay here and show the text
    // below. See docs/ROUTING.md.
    (function () {
      var l = window.location;
      var last = l.pathname.split('/').pop();
      if (last.indexOf('.') !== -1) return;
      l.replace(
        l.protocol + '//' + l.host + '/?/' +
        l.pathname.slice(1).replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    })();
  </script>
</head>
<body>
  <main>
    <h1>Taking you back to base camp</h1>
    <p>That page does not exist. <a href="/">Go to eiger014.com</a></p>
  </main>
</body>
</html>
