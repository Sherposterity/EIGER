<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EIGER</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
  <style>
    html, body { margin: 0; min-height: 100%; background: #0A0A0A; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { min-height: 100vh; display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center; padding: 2rem; gap: 1rem; }
    h1 { font-size: 2rem; margin: 0; }
    p { color: rgba(255,255,255,.6); margin: 0; }
    a { color: #fff; }
  </style>
  <script>
    // GitHub Pages serves this for any unknown path. The app uses hash
    // routes, so a bare /mission or /about (typed, or shared without the #)
    // is forwarded to the matching in-app route. Anything else lands on home.
    (function () {
      var path = window.location.pathname.replace(/\/+$/, '').toLowerCase();
      var known = { '/mission': '/mission', '/about': '/about', '/giveaway': '/giveaway', '/giveaway/rules': '/giveaway/rules' };
      var target = known[path] || '/';
      window.location.replace('/#' + target + window.location.search);
    })();
  </script>
</head>
<body>
  <main>
    <h1>Taking you back to base camp</h1>
    <p>That page does not exist. <a href="/">Go to eiger014.com</a></p>
  </main>
</body>
</html>
